server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: procreds-backend
  
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/procreds}
      auto-index-creation: true
  
  security:
    user:
      name: ${SECURITY_USER:admin}
      password: ${SECURITY_PASSWORD:admin123}
      roles: ADMIN

# Logging configuration
logging:
  level:
    com.procreds: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc OpenAPI 3 configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  info:
    title: ProCreds API
    description: DevOps Platform Credential Manager API
    version: 1.0.0
    contact:
      name: ProCreds Team
      email: support@procreds.com
  servers:
    - url: http://localhost:8080/api
      description: Development server

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

