rootProject.name = 'procreds-backend'

// Enable Gradle's configuration cache for better performance
enableFeaturePreview('CONFIGURATION_CACHE')

// Configure dependency resolution strategy
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

